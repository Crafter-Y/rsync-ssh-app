name: Rsync SSH
version: "1.0.3"
slug: rsync_ssh
description: Key-authenticated, directory-restricted rsync backup storage over SSH
url: https://github.com/Crafter-Y/rsync-ssh-app
arch:
  - aarch64
  - amd64
image: ghcr.io/crafter-y/{arch}-rsync-ssh
init: false
startup: services
boot: auto
stage: stable
host_network: false
apparmor: true
ports:
  2222/tcp: 2222
ports_description:
  2222/tcp: SSH for restricted rsync (public-key authentication only)
map:
  - type: media
    read_only: false
options:
  username: backup
  authorized_keys: []
  storage_root: /media/backup_disk
  directory: friend
schema:
  username: match(^[a-z_][a-z0-9_-]{0,31}$)
  authorized_keys:
    - str
  storage_root: str
  directory: match(^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$)
